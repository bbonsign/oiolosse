[tasks.default]
description = "Choose a task to run"
run = "mise tasks ls | fzf --header-lines=0 | awk '{print $1}' | xargs -r mise run"

[tasks.check_flake]
description = "nix flake check"
alias = "c"
run = "nix flake check"

[tasks.format]
description = "nix fmt"
alias = "f"
run = "nix fmt"

[tasks.switch]
description = "Nixos switch"
alias = "sw"
run = "sudo nixos-rebuild switch --fast --flake .#mithlond"

[tasks.deploy]
description = "Build mithlond locally and deploy it over Tailscale"
alias = "d"
usage = '''
  arg "<action>" default="switch" {
    choices "switch" "test" "boot"
  }
'''
run = "nix run .#nixosConfigurations.mithlond.config.system.build.nixos-rebuild -- ${usage_action} --flake .#mithlond --target-host bbonsign@mithlond --ask-sudo-password"

[tasks.update]
description = "Update Flake"
alias = ["up", "u"]
run = "nix flake update"

[tasks.update-inputs]
description = "Choose Flake inputs to update"
alias = "ui"
run = '''
nix flake metadata --json \
  | jq -r '.locks.nodes.root.inputs | keys[]' \
  | fzf --multi --header='Tab: toggle selection' --bind 'ctrl-a:toggle-all,ctrl-delete:deselect-all' \
  | xargs --no-run-if-empty nix flake update
'''

[tasks.update-inputs-except]
description = "Choose Flake inputs not to update"
alias = "uie"
run = '''
inputs="$(mktemp)"
excluded="$(mktemp)"
trap 'rm -f "$inputs" "$excluded"' EXIT

nix flake metadata --json \
  | jq -r '.locks.nodes.root.inputs | keys[]' \
  > "$inputs"

if ! fzf --multi --header='Tab: exclude input from update' --bind 'ctrl-a:toggle-all,ctrl-delete:deselect-all' \
  < "$inputs" > "$excluded"; then
  exit 0
fi

grep --fixed-strings --line-regexp --invert-match --file="$excluded" "$inputs" \
  | xargs --no-run-if-empty nix flake update
'''

[tasks.news]
description = "Home manager news"
alias = ["n"]
run = "NIXPKGS_ALLOW_UNFREE=1 nix run home-manager -- --flake . --impure news"

[tasks.hm-old]
description = "Home manager"
usage = '''
  arg "cmd" default="switch"
'''
run = "NIXPKGS_ALLOW_UNFREE=1 nix run home-manager -- --flake . --impure -b hm-backup $usage_cmd"

[tasks.hm]
description = "Home manager NH"
run = "nh home switch . -c bbonsign"

[tasks.gpu-setup]
description = "Install the current Home Manager GPU drivers on non-NixOS"
run = '''
if [ -e /etc/NIXOS ]; then
  echo "gpu-setup is only for non-NixOS systems" >&2
  exit 1
fi

setup="$(nix build --no-link --print-out-paths '.#homeConfigurations.bbonsign.config.targets.genericLinux.gpu.setupPackage')"
sudo "$setup/bin/non-nixos-gpu-setup"
'''

[tasks."gc"]
description = "Nix Garbage Collection with nh"
run = "nh clean user"

[tasks.gc-old]
description = "Nix Garbage Collection"
usage = '''
  arg "days" default="50"
'''
run = ["nix store gc", "nix-collect-garbage --delete-older-than ${usage_days}d"]

[tasks.dots]
description = "Symlink non-home-manager dotfiles"
run = "./dotfiles/symlink.nu"

[tasks.keyd]
description = "Update and reload the keyd config"
run = "keyd-reload.nu"
