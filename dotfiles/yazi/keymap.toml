[[mgr.prepend_keymap]]
on = ["v"]
run = ["toggle", "arrow 1"]

[[mgr.prepend_keymap]]
on = ["<space>", "?"]
run = "help"

[[mgr.prepend_keymap]]
on = ["g", "?"]
run = "help"

[[help.prepend_keymap]]
on = ["/"]
run = "filter"

[[mgr.prepend_keymap]]
on = ["<space>", "S", "M"]
run = "sort mtime --reverse=no; linemode mtime"
desc = "Sort by modified time"

[[mgr.prepend_keymap]]
on = ["<space>", "s", "m"]
run = "sort mtime --reverse; linemode mtime"
desc = "Sort by modified time (reverse)"

[[mgr.prepend_keymap]]
on = ["<space>", "s", "b"]
run = "sort btime --reverse=no; linemode btime"
desc = "Sort by birth time"

[[mgr.prepend_keymap]]
on = ["<space>", "S", "B"]
run = "sort btime --reverse; linemode btime"
desc = "Sort by birth time (reverse)"

[[mgr.prepend_keymap]]
on = ["<space>", "s", "e"]
run = "sort extension --reverse=no"
desc = "Sort by extension"

[[mgr.prepend_keymap]]
on = ["<space>", "S", "E"]
run = "sort extension --reverse"
desc = "Sort by extension (reverse)"

[[mgr.prepend_keymap]]
on = ["<space>", "s", "a"]
run = "sort alphabetical --reverse=no"
desc = "Sort alphabetically"

[[mgr.prepend_keymap]]
on = ["<space>", "S", "A"]
run = "sort alphabetical --reverse"
desc = "Sort alphabetically (reverse)"

[[mgr.prepend_keymap]]
on = ["<space>", "s", "n"]
run = "sort natural --reverse=no"
desc = "Sort naturally"

[[mgr.prepend_keymap]]
on = ["<space>", "S", "N"]
run = "sort natural --reverse"
desc = "Sort naturally (reverse)"

[[mgr.prepend_keymap]]
on = ["<space>", "s", "s"]
run = "sort size --reverse=no; linemode size"
desc = "Sort by size"

[[mgr.prepend_keymap]]
on = ["<space>", "S", "S"]
run = "sort size --reverse; linemode size"
desc = "Sort by size (reverse)"

[[mgr.prepend_keymap]]
on = "!"
for = "unix"
run = 'shell "nu" --block'
desc = "Open $SHELL here"

[[mgr.prepend_keymap]]
on = ["g", "r"]
run = 'shell -- ya emit cd "$(git rev-parse --show-toplevel)"'

[[mgr.prepend_keymap]]
on = "<Enter>"
run = "plugin smart-enter"
desc = "Enter the child directory, or open the file"

[[mgr.prepend_keymap]]
on = "T"
run = "plugin smart-tab"
desc = "Create a tab and enter the hovered directory"


[[mgr.prepend_keymap]]
on = "-"
run = "leave"
desc = "Back to the parent directory"

[[mgr.prepend_keymap]]
on = "<C-h>"
run = "back"

[[mgr.prepend_keymap]]
on = "<C-l>"
run = "forward"

[[mgr.prepend_keymap]]
on = "<C-k>"
run = "plugin parent-arrow -1"

[[mgr.prepend_keymap]]
on = "<C-j>"
run = "plugin parent-arrow 1"

[[mgr.prepend_keymap]]
on = "H"
run = "plugin duckdb -1"
desc = "Scroll one column to the left"

[[mgr.prepend_keymap]]
on = "L"
run = "plugin duckdb +1"
desc = "Scroll one column to the right"

[[mgr.prepend_keymap]]
on = ["g", "u"]
run = "plugin duckdb -open"
desc = "open with duckdb"

[[mgr.prepend_keymap]]
on = ["g", "U"]
run = "plugin duckdb -ui"
desc = "open with duckdb ui"
