# ==============================================================================
# Keybinds
# Defining this table replaces the built-in bind set, so every active bind that
# should remain available is listed here.
# Syntax: https://docs.noctalia.dev/umbriel/keybinds/
# Actions: https://docs.noctalia.dev/umbriel/actions/
[keybinds]

# Applications and shell
"Mod+Return" = { action = "spawn:$HOME/.local/kitty.app/bin/kitty --single-instance || kitty --single-instance", repeat = false }
"Mod+T" = { action = "spawn:$HOME/.local/kitty.app/bin/kitty --class time-tui -e $HOME/.local/bin/time-tui", repeat = false }
"Mod+Ctrl+D" = { action = "spawn:fuzzel --show-actions --lines 20 --width 80", repeat = false }
"Mod+D" = { action = "spawn:vicinae vicinae://toggle", repeat = false }
"Mod+Grave" = { action = "spawn:kitty --single-instance yazi || $HOME/.local/kitty.app/bin/kitty yazi", repeat = false }
"Mod+E" = { action = "spawn:vicinae vicinae://launch/core/search-emojis", repeat = false }
"Mod+R" = { action = "spawn:vicinae vicinae://launch/clipboard/history", repeat = false }
# "Mod+Alt+L" = { action = "spawn:hyprlock", repeat = false }
"Mod+Space" = { action = "submap:leader", repeat = false }
"Mod+Ctrl+Slash" = { action = "spawn:$HOME/.local/kitty.app/bin/kitty --class umbriel-actions -e $HOME/.local/bin/umbriel-msg || kitty --class umbriel-actions -e $HOME/.local/bin/umbriel-msg", repeat = false }
"Mod+Tab" = { action = "spawn:noctalia msg window-switcher", repeat = false }
"Mod+Period" = { action = "spawn:vicinae vicinae://launch/wm/switch-windows", repeat = false }
"Mod+Comma" = { action = "spawn:vicinae vicinae://launch/wm/switch-windows", repeat = false }
"Mod+Shift+Semicolon" = { action = "spawn:noctalia msg panel-toggle launcher", repeat = false }
"Mod+Ctrl+Comma" = { action = "spawn:noctalia msg settings-toggle", repeat = false }
"Mod+N" = { action = "spawn:noctalia msg panel-toggle control-center notifications", repeat = false }
"Mod+BackSpace" = { action = "spawn:noctalia msg notification-clear-active", repeat = false }
"Mod+Shift+BackSpace" = { action = "spawn:noctalia msg notification-clear-history", repeat = false }
"Mod+Ctrl+B" = { action = "spawn:noctalia msg bar-toggle", repeat = false }
"Mod+W" = { action = "spawn:noctalia msg panel-toggle control-center", repeat = false }
"Mod+Shift+W" = { action = "spawn:noctalia msg panel-toggle control-center weather", repeat = false }
"Mod+Ctrl+W" = { action = "spawn:noctalia msg panel-toggle wallpaper", repeat = false }

# Focus and movement
"Mod+C" = "window-center"
"Mod+Left" = "window-focus-left"
"Mod+Down" = "window-focus-down"
"Mod+Up" = "window-focus-up"
"Mod+Right" = "window-focus-right"
"Mod+H" = "window-focus-or-output-left"
"Mod+J" = "window-focus-or-workspace-down"
"Mod+K" = "window-focus-or-workspace-up"
"Mod+L" = "window-focus-or-output-right"
"Mod+Home" = "column-focus-first"
"Mod+End" = "column-focus-last"
"Mod+Ctrl+BracketLeft" = "column-focus-tab-previous"
"Mod+Ctrl+BracketRight" = "column-focus-tab-next"
"Mod+Shift+Home" = "column-move-to-first"
"Mod+Shift+End" = "column-move-to-last"
"Mod+Ctrl+Left" = "output-focus-left"
"Mod+Ctrl+Down" = "output-focus-down"
"Mod+Ctrl+Up" = "output-focus-up"
"Mod+Ctrl+Right" = "output-focus-right"
"Mod+Ctrl+H" = "output-focus-left"
"Mod+Ctrl+J" = "output-focus-down"
"Mod+Ctrl+K" = "output-focus-up"
"Mod+Ctrl+L" = "output-focus-right"
"Mod+P" = "window-focus-previous"
"Mod+U" = "workspace-next"
"Mod+I" = "workspace-previous"
"Mod+Page_Down" = "workspace-next"
"Mod+Page_Up" = "workspace-previous"
"Mod+Y" = "output-focus-left"
"Mod+O" = "output-focus-right"
"Mod+BracketLeft" = "output-focus-left"
"Mod+BracketRight" = "output-focus-right"
"Mod+Shift+Left" = "column-move-left"
"Mod+Shift+Down" = "window-move-down"
"Mod+Shift+Up" = "window-move-up"
"Mod+Shift+Right" = "column-move-right"
"Mod+Shift+H" = "column-move-left"
"Mod+Shift+J" = "window-move-or-workspace-down"
"Mod+Shift+K" = "window-move-or-workspace-up"
"Mod+Shift+L" = "column-move-right"
"Mod+Shift+Ctrl+Left" = "column-move-to-output-left"
"Mod+Shift+Ctrl+Down" = "column-move-to-output-down"
"Mod+Shift+Ctrl+Up" = "column-move-to-output-up"
"Mod+Shift+Ctrl+Right" = "column-move-to-output-right"
"Mod+Shift+U" = "workspace-move-down"
"Mod+Shift+I" = "workspace-move-up"
"Mod+Shift+Y" = "workspace-move-to-output-left"
"Mod+Shift+O" = "workspace-move-to-output-right"

# Window state and layout
"Mod+A" = { action = "overview-toggle", repeat = false }
"Mod+Shift+T" = { action = "column-toggle-tabbed", repeat = false }
"Mod+F" = { action = "window-toggle-maximize", repeat = false }
"Mod+Shift+F" = { action = "window-toggle-fullscreen", repeat = false }
"Mod+Ctrl+Shift+F" = { action = "window-toggle-maximize-to-edges", repeat = false }
"Mod+Ctrl+F" = { action = "window-toggle-floating", repeat = false }
"Mod+Alt+F" = { action = "window-focus-switch-floating", repeat = false }
"Mod+Shift+R" = "window-cycle-primary-extent"
"Mod+Ctrl+R" = "window-cycle-secondary-extent"
"Mod+Shift+BracketLeft" = "window-consume-or-expel-left"
"Mod+Shift+BracketRight" = "window-consume-or-expel-right"
"Mod+Ctrl+Minus" = "window-modify-primary-extent:-0.1"
"Mod+Ctrl+Equal" = "window-modify-primary-extent:0.1"
"Mod+Shift+Minus" = "window-modify-secondary-extent:-0.1"
"Mod+Shift+Equal" = "window-modify-secondary-extent:0.1"
"Mod+WheelUp" = "window-focus-left"
"Mod+WheelDown" = "window-focus-right"
"Mod+Shift+WheelUp" = { action = "workspace-previous", cooldown_ms = 150 }
"Mod+Shift+WheelDown" = { action = "workspace-next", cooldown_ms = 150 }

# Workspaces
"Mod+1" = "workspace-switch:term"
"Mod+2" = "workspace-switch:web"
"Mod+3" = "workspace-switch:chat"
"Mod+4" = "workspace-switch:email"
"Mod+5" = "workspace-switch:5"
"Mod+6" = "workspace-switch:6"
"Mod+7" = "workspace-switch:7"
"Mod+8" = "workspace-switch:8"
"Mod+9" = "workspace-switch:9"
"Mod+Shift+1" = "window-move-to-workspace:1"
"Mod+Shift+2" = "window-move-to-workspace:2"
"Mod+Shift+3" = "window-move-to-workspace:3"
"Mod+Shift+4" = "window-move-to-workspace:4"
"Mod+Shift+5" = "window-move-to-workspace:5"
"Mod+Shift+6" = "window-move-to-workspace:6"
"Mod+Shift+7" = "window-move-to-workspace:7"
"Mod+Shift+8" = "window-move-to-workspace:8"
"Mod+Shift+9" = "window-move-to-workspace:9"

# Scratchpad
"Mod+Minus" = { action = "scratchpad-toggle:term", repeat = false }

# Screenshots, session, media, and hardware
"Print" = { action = "spawn:noctalia msg screenshot-region", repeat = false }
"Mod+Shift+Slash" = { action = "cheatsheet-toggle", repeat = false }
"Mod+Shift+Q" = { action = "window-close", repeat = false }
"Mod+Alt+E" = { action = "session-quit", repeat = false }
"Ctrl+Alt+Delete" = { action = "session-quit", repeat = false }
"Mod+Escape" = { action = "shortcuts-inhibit-toggle", allow_when_inhibited = true, repeat = false }
"Mod+Ctrl+Shift+P" = { action = "dpms-off", repeat = false }
"XF86AudioRaiseVolume" = { action = "spawn:noctalia msg volume-up", allow_when_locked = true }
"XF86AudioLowerVolume" = { action = "spawn:noctalia msg volume-down", allow_when_locked = true }
"XF86AudioMute" = { action = "spawn:noctalia msg volume-mute", allow_when_locked = true }
"XF86AudioMicMute" = { action = "spawn:wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle", allow_when_locked = true }
"Mod+M" = { action = "spawn:wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle", allow_when_locked = true }
"XF86AudioPlay" = { action = "spawn:playerctl play-pause", allow_when_locked = true }
"XF86AudioPause" = { action = "spawn:playerctl pause", allow_when_locked = true }
"XF86AudioStop" = { action = "spawn:playerctl stop", allow_when_locked = true }
"XF86AudioForward" = { action = "spawn:playerctl position +10", allow_when_locked = true }
"XF86AudioNext" = { action = "spawn:playerctl next", allow_when_locked = true }
"XF86AudioPrev" = { action = "spawn:playerctl previous", allow_when_locked = true }
"XF86AudioRewind" = { action = "spawn:playerctl position -10", allow_when_locked = true }
"XF86MonBrightnessDown" = { action = "spawn:brightnessctl set 5%-", allow_when_locked = true }
"XF86MonBrightnessUp" = { action = "spawn:brightnessctl set 5%+", allow_when_locked = true }

# "Mod+S" = { action = "submap:screencapture", repeat = false }
# "submap[screencapture],1" = { action = "spawn:noctalia msg screenshot-region", submap = "reset" }
# "submap[screencapture],2" = { action = "submap:region", repeat = false }
# "submap[screencapture],Escape" = "submap:reset"
# "submap[screencapture],BackSpace" = "submap:reset"
# "submap[region],R" = { action = "spawn:grim -g \"$(slurp)\" screenshot.png", submap = "reset" }
# "submap[region],Escape" = "submap:reset"
# "submap[region],BackSpace" = "submap:reset"

# Native leader menu. Noctalia only displays these bindings; Umbriel executes
# them. Submenus replace their parent (pop then push), keeping ONE active layer.
# Actions/Escape exit to default; BackSpace explicitly restores the parent menu.
# Explicit Shift is required for uppercase shortcuts (keysyms are case-folded).
"submap[leader],Space" = { action = "spawn:vicinae vicinae://toggle", submap = "reset" }
"submap[leader],BackSpace" = { action = "spawn:noctalia msg notification-clear-active", submap = "reset" }
"submap[leader],Tab" = { action = "spawn:noctalia msg window-switcher", submap = "reset" }
"submap[leader],a" = { action = "overview-toggle", submap = "reset" }
"submap[leader],b" = { action = "submap:reset", submap = "bar" }
"submap[leader],c" = { action = "submap:reset", submap = "colorpicker" }
"submap[leader],d" = { action = "spawn:fuzzel --show-actions --lines 20 --width 80", submap = "reset" }
"submap[leader],k" = { action = "spawn:$HOME/.local/bin/kitty-switch-fuzzel.nu", submap = "reset" }
"submap[leader],n" = { action = "submap:reset", submap = "notifications" }
"submap[leader],r" = { action = "submap:reset", submap = "run" }
"submap[leader],Shift+r" = { action = "spawn:noctalia msg config-reload", submap = "reset" }
"submap[leader],s" = { action = "submap:reset", submap = "screencapture" }
"submap[leader],t" = { action = "spawn:$HOME/.local/kitty.app/bin/kitty --class time-tui -e $HOME/.local/bin/time-tui", submap = "reset" }
# "submap[leader],w" = { action = "submap:windows", repeat = false }
"submap[leader],w" = { action = "submap:reset", submap = "windows" }
"submap[leader],Shift+w" = { action = "submap:reset", submap = "workspaces" }
"submap[leader],0" = { action = "submap:reset", submap = "power" }
"submap[leader],1" = { action = "workspace-switch:term", submap = "reset" }
"submap[leader],2" = { action = "workspace-switch:web", submap = "reset" }
"submap[leader],3" = { action = "workspace-switch:chat", submap = "reset" }
"submap[leader],4" = { action = "workspace-switch:email", submap = "reset" }
"submap[leader],5" = { action = "workspace-switch:5", submap = "reset" }
"submap[leader],6" = { action = "workspace-switch:6", submap = "reset" }
"submap[leader],7" = { action = "workspace-switch:7", submap = "reset" }
"submap[leader],8" = { action = "workspace-switch:8", submap = "reset" }
"submap[leader],9" = { action = "workspace-switch:9", submap = "reset" }

"submap[bar],BackSpace" = { action = "submap:reset", submap = "leader" }
"submap[bar],b" = { action = "spawn:noctalia msg bar-toggle", submap = "reset" }
"submap[colorpicker],BackSpace" = { action = "submap:reset", submap = "leader" }
"submap[colorpicker],c" = { action = "spawn:hyprpicker --autocopy", submap = "reset" }
"submap[colorpicker],r" = { action = "spawn:hyprpicker --autocopy --format=rgb", submap = "reset" }
"submap[notifications],BackSpace" = { action = "submap:reset", submap = "leader" }
"submap[notifications],n" = { action = "spawn:noctalia msg panel-toggle control-center notifications", submap = "reset" }
"submap[notifications],c" = { action = "spawn:noctalia msg notification-clear-active", submap = "reset" }
"submap[notifications],Shift+c" = { action = "spawn:noctalia msg notification-clear-history", submap = "reset" }
"submap[run],BackSpace" = { action = "submap:reset", submap = "leader" }
"submap[run],b" = { action = "spawn:$HOME/.local/kitty.app/bin/kitty --class kitty-btop btop", submap = "reset" }
"submap[run],Shift+b" = { action = "spawn:$HOME/.local/kitty.app/bin/kitty --class kitty-btm btm", submap = "reset" }
"submap[run],f" = { action = "spawn:nautilus", submap = "reset" }
"submap[run],k" = { action = "spawn:$HOME/.local/bin/kitty-switch-fuzzel.nu", submap = "reset" }
"submap[run],p" = { action = "spawn:$HOME/.local/bin/power-profiles.nu", submap = "reset" }
"submap[windows],BackSpace" = { action = "submap:reset", submap = "leader" }
"submap[windows],h" = { action = "window-focus-or-output-left", submap = "reset" }
"submap[windows],j" = { action = "window-focus-or-workspace-down", submap = "reset" }
"submap[windows],k" = { action = "window-focus-or-workspace-up", submap = "reset" }
"submap[windows],l" = { action = "window-focus-or-output-right", submap = "reset" }
"submap[windows],Shift+h" = { action = "column-move-left", submap = "reset" }
"submap[windows],Shift+j" = { action = "window-move-or-workspace-down", submap = "reset" }
"submap[windows],Shift+k" = { action = "window-move-or-workspace-up", submap = "reset" }
"submap[windows],Shift+l" = { action = "column-move-right", submap = "reset" }
"submap[workspaces],BackSpace" = { action = "submap:reset", submap = "leader" }
"submap[workspaces],j" = { action = "workspace-move-down", submap = "reset" }
"submap[workspaces],k" = { action = "workspace-move-up", submap = "reset" }
"submap[workspaces],h" = { action = "workspace-move-to-output-left", submap = "reset" }
"submap[workspaces],l" = { action = "workspace-move-to-output-right", submap = "reset" }
"submap[workspaces],Shift+j" = { action = "workspace-move-to-output-down", submap = "reset" }
"submap[workspaces],Shift+k" = { action = "workspace-move-to-output-up", submap = "reset" }
"submap[power],BackSpace" = { action = "submap:reset", submap = "leader" }
"submap[power],l" = { action = "spawn:hyprlock", submap = "reset" }
"submap[power],e" = { action = "session-quit", submap = "reset" }
"submap[power],s" = { action = "spawn:systemctl suspend", submap = "reset" }
"submap[power],h" = { action = "spawn:systemctl hibernate", submap = "reset" }
"submap[power],Shift+r" = { action = "spawn:systemctl reboot", submap = "reset" }
"submap[power],Shift+s" = { action = "spawn:systemctl poweroff", submap = "reset" }
"Escape" = "submap:reset"
