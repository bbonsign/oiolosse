[[scratchpad]]
name = "quake"
spawn_when_empty = "kitty --class=quake"

[[window_rule]]
match.app_id = "^quake$"
default_scratchpad = "quake"
default_floating_size = { width = 0.98, height = 0.33 }
default_position = { x = 0, y = 10, anchor = "top" }
corner_radius = 0

[effects.preset.slide-down]
kind = "animation"
shader = "effects/slide-down.glsl"

[animation.scratchpad]
effect = "slide-down"
dim = 0.0

[keybinds]
"Mod+Shift+Minus" = { action = "scratchpad-toggle quake", repeat = false }
