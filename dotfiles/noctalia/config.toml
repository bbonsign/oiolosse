[backdrop]
blur_intensity = 0.13999999687075615
tint_intensity = 0.0

[bar]
order = ["default"]

[bar.default]
auto_hide = false
background_opacity = 0.4999999888241291
center = ["clock", "date", "bar", "clipboard", "screenshot"]
contact_shadow = true
end = [
  "privacy",
  "media",
  "network",
  "bluetooth",
  "group:g1",
  "tray",
  "session",
  "group:g2",
  "notifications",
]
margin_edge = 0
margin_ends = 0
reserve_space = true
start = ["launcher", "wallpaper", "workspaces", "spacer_3", "taskbar"]
thickness = 25

[bar.default.dead_zone.actions]
left = "window-switcher"
scroll_down = "taskbar-cycle next"
scroll_left = "taskbar-cycle prev"
scroll_right = "taskbar-cycle next"
scroll_up = "taskbar-cycle prev"

[[bar.default.capsule_group]]
fill = "surface_variant"
id = "g1"
members = ["volume", "brightness"]
opacity = 0.69999998807907104
padding = 6.0

[[bar.default.capsule_group]]
fill = "surface_variant"
id = "g2"
members = ["power_profile", "battery"]
opacity = 0.69999998807907104
padding = 6.0

[brightness]
