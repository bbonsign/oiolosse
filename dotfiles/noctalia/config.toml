[widget.date]
format = " %H:%M UTC "
timezone = "UTC"

[widget.media]
hide_when_no_media = true
title_scroll = "on_hover"

[widget.network]
show_label = false

[widget.power_profile]
color = "primary"

[widget.screenshot]
glyph = "box-align-top-left-filled"

[widget.spacer_2]
type = "spacer"

[widget.spacer_3]
length = 30
type = "spacer"

[widget.taskbar]
only_active_workspace = true

[widget.taskbar.actions]
