[backdrop]
blur_intensity = 0.13999999687075615
tint_intensity = 0.0

[bar]
order = ["default"]

[bar.default]
auto_hide = false
background_opacity = 0.64999998547136784
center = ["clock", "date", "screenshot"]
contact_shadow = true
end = [
  "media",
  "clipboard",
  "network",
  "bluetooth",
  "group:g1",
  "tray",
  "session",
  "group:g2",
  "notifications",
]
margin_edge = 0
margin_ends = 0
reserve_space = true
start = ["launcher", "wallpaper", "workspaces", "spacer_3", "taskbar"]
thickness = 25

[bar.default.dead_zone.actions]
left = "window-switcher"
scroll_down = "taskbar-cycle next"
scroll_left = "taskbar-cycle prev"
scroll_right = "taskbar-cycle next"
scroll_up = "taskbar-cycle preQ"

[[bar.default.capsule_group]]
fill = "surface_variant"
id = "g1"
members = ["volume", "brightness"]
opacity = 0.69999998807907104
padding = 6.0

[[bar.default.capsule_group]]
fill = "surface_variant"
id = "g2"
members = ["power_profile", "battery"]
opacity = 0.69999998807907104
padding = 6.0

[brightness]
enable_ddcutil = true
minimum_brightness = 0.050000000000000003

[calendar]
enabled = true
refresh_minutes = 30

[desktop_widgets]
enabled = false
schema_version = 2
widget_order = []

[desktop_widgets.grid]
cell_size = 8
major_interval = 4
visible = true

[desktop_widgets.widget]

[dock]
active_monitor_only = true
auto_hide = true
background_opacity = 0.79999998211860657
cross_axis_padding = 4
enabled = true
icon_size = 40
main_axis_padding = 8
reserve_space = false

[hot_corners]
enabled = true

[hot_corners.bottom_right]
action = "window_switcher"

[location]
address = "Cary, NC"

[lockscreen]
enabled = false

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [
  "lockscreen-login-box@DP-3",
  "lockscreen-login-box@DP-4",
  "lockscreen-login-box@eDP-1",
]

[lockscreen_widgets.grid]
cell_size = 8
major_interval = 4
visible = true

[lockscreen_widgets.widget."lockscreen-login-box@DP-3"]
box_height = 70.0
box_width = 400.0
cx = 960.0
cy = 961.0
output = "DP-3"
rotation = 0.0
type = "login_box"

[lockscreen_widgets.widget."lockscreen-login-box@DP-3".settings]
background_color = "surface_variant"
background_opacity = 0.88
background_radius = 12.0
center_password_text = false
input_opacity = 1.0
input_radius = 6.0
show_caps_lock = true
show_keyboard_layout = true
show_login_button = true

[lockscreen_widgets.widget."lockscreen-login-box@DP-4"]
box_height = 70.0
box_width = 400.0
cx = 960.0
cy = 1077.0
output = "DP-4"
rotation = 0.0
type = "login_box"

[lockscreen_widgets.widget."lockscreen-login-box@DP-4".settings]
center_password_text = false
show_caps_lock = true
show_keyboard_layout = true
show_login_button = true

[lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
box_height = 70.0
box_width = 400.0
cx = 960.0
cy = 1077.0
output = "eDP-1"
rotation = 0.0
type = "login_box"

[lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
center_password_text = false
show_caps_lock = true
show_keyboard_layout = true
show_login_button = true

[notification]
background_opacity = 0.90000000000000002

[osd]
position = "bottom_center"

[osd.kinds]
keyboard_layout = false
lock_keys = false

[plugins]
enabled = []

[shell]
avatar_path = "/var/home/bbonsign/.face.jpeg"
niri_overview_type_to_launch_enabled = true
settings_show_advanced = true
telemetry_enabled = true

[shell.animation]
speed = 1.8500000275671482

[shell.launcher]
provider_prefix = ":"

[shell.panel]
open_near_click_control_center = true
open_near_click_session = true
open_near_click_wallpaper = true
transparency_mode = "glass"

[shell.screenshot]
confirm_region = true
directory = "/var/home/bbonsign/Pictures/Screenshots"

[[shell.session.actions]]
action = "lock"
command = "hyprlock"
enabled = true
shortcut = "1"
variant = "default"

[[shell.session.actions]]
action = "logout"
enabled = true
shortcut = "2"
variant = "default"

[[shell.session.actions]]
action = "lock_and_suspend"
enabled = true
shortcut = "3"
variant = "default"

[[shell.session.actions]]
action = "reboot"
enabled = true
shortcut = "4"
variant = "default"

[[shell.session.actions]]
action = "shutdown"
enabled = true
shortcut = "5"
variant = "destructive"

[theme]
builtin = "Tokyo-Night"
community_palette = "Tokyo Night Moon"

[wallpaper]
directory = "/var/home/bbonsign/Pictures/wallpapers"
edge_smoothness = 0.39999999105930328
transition = ["honeycomb"]
transition_duration = 4000
transition_on_startup = true

[wallpaper.default]
path = "/var/home/bbonsign/Pictures/wallpapers/slava-abramovitch-enAcB20iHAg-unsplash.jpg"

[wallpaper.last]
path = "/var/home/bbonsign/Pictures/wallpapers/slava-abramovitch-enAcB20iHAg-unsplash.jpg"

[wallpaper.monitors.DP-3]
path = "/var/home/bbonsign/Pictures/wallpapers/slava-abramovitch-enAcB20iHAg-unsplash.jpg"

[wallpaper.monitors.DP-4]
path = "/var/home/bbonsign/Pictures/wallpapers/slava-abramovitch-enAcB20iHAg-unsplash.jpg"

[wallpaper.monitors.eDP-1]
path = "/var/home/bbonsign/Pictures/wallpapers/slava-abramovitch-enAcB20iHAg-unsplash.jpg"

[[wallpaper.favorite]]
builtin_palette = "Tokyo-Night"
palette_source = "builtin"
path = "/var/home/bbonsign/Pictures/wallpapers/slava-abramovitch-enAcB20iHAg-unsplash.jpg"
theme_mode = "dark"

[widget.battery]
color = "primary"
display_mode = "graphic"
font_family = "FiraCode Nerd Font"

[widget.bluetooth]
color = "primary"

[widget.bluetooth.actions]
right = "none"

[widget.clock]
format = "%I:%M %p    %H:%M    %a %d %b %Y  "

[widget.custom_button_bb]
