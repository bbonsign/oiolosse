[metadata]
name = "aws-profiles"
description = "List and switch AWS CLI profiles"
requirements = ["aws", "nu"]

[source]
command = "aws configure list-profiles"

[preview]
command = "aws configure list --profile '{}'"

[ui.preview_panel]
size = 40

